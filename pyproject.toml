[project]
name = "icml26-repro-qIOcJSCGn2-survival-value-learning"
version = "0.1.0"
description = "Clean-room repro of SVL (Goal-Conditioned RL as Survival Learning), ICML 2026, OpenReview qIOcJSCGn2."
requires-python = "==3.10.*"
dependencies = [
    "chex==0.1.86",
    "distrax==0.1.5",
    "dm-control==1.0.26",
    "flax==0.7.4",
    "gymnasium==1.3.0",
    "jax==0.4.23",
    "jaxlib==0.4.23",
    "ml-collections==1.1.0",
    "mujoco==3.2.6",
    "numpy==1.26.4",
    "ogbench==1.2.1",
    "optax==0.2.2",
    "orbax-checkpoint==0.5.16",
    "psutil==7.2.2",
    "pyyaml==6.0.2",
    "scipy==1.12.0",
]
[tool.pytest.ini_options]
pythonpath = ["repro/src"]
